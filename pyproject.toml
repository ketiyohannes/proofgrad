[project]
name = "proofgrad"
version = "0.1.0"
description = "Fine-tuning small coding models with hidden specs and proofs as the reward."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.6.0",
    "datasets>=5.1.0",
    "hypothesis>=6.170.15",
    "mlx-lm",
    "peft>=0.21.2",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
    "torch>=2.15.0",
    "transformers>=5.22.2",
    "trl>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proofgrad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyPI is heavily throttled on the dev network; pytorch.org serves the same macOS
# wheels quickly. Linux (the RTX 4070 training box) keeps PyPI's CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'darwin'" }]
